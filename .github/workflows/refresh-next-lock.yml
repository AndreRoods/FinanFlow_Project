name: Refresh pnpm lockfile for Next.js security update # temporary

on:
  push:
    branches:
      - fix/nextjs-security-update

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit updated lockfile and remove temporary workflow
        run: |
          rm .github/workflows/refresh-next-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/refresh-next-lock.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate pnpm lockfile"
            git push
          fi
